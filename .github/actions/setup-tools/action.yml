name: Set up pinned tools
description: Install the pinned Python and pip packages (NFR-010).

inputs:
  python-version:
    description: Pinned Python version
    required: true
  packages:
    description: Space-separated pip requirements, each pinned with ==
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pinned packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: python -m pip install --disable-pip-version-check $PACKAGES
